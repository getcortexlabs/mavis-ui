name: Direct NativeScript adapters
on:
  pull_request:
    paths:
      - 'packages/nativescript/**'
      - 'packages/core/**'
      - 'examples/native-adapters/**'
      - 'scripts/*native-adapters*'
      - 'scripts/build-svelte-adapter.mjs'
      - 'scripts/install-acceptance-tarballs.mjs'
      - 'package*.json'
      - '.github/workflows/native-adapters.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-adapters-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: Direct ${{ matrix.framework }} on iOS
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        framework: [plain, react, angular, svelte, solid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install xcodeproj cocoapods --no-document
      - run: npm install --global nativescript@9.1.2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pack-release.mjs
      - run: npm ci --prefix examples/native-adapters --no-audit --no-fund
      - run: node scripts/install-acceptance-tarballs.mjs adapters
      - run: node scripts/check-native-adapters.mjs ios ${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-${{ matrix.framework }}-ios
          path: |
            artifacts/native-adapters/ios/${{ matrix.framework }}
            artifacts/release/packages/installed-adapters.json
  android:
    name: Direct ${{ matrix.framework }} on Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        framework: [plain, react, angular, svelte, solid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm install --global nativescript@9.1.2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pack-release.mjs
      - run: npm ci --prefix examples/native-adapters --no-audit --no-fund
      - run: node scripts/install-acceptance-tarballs.mjs adapters
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: node scripts/check-native-adapters.mjs android ${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-${{ matrix.framework }}-android
          path: |
            artifacts/native-adapters/android/${{ matrix.framework }}
            artifacts/release/packages/installed-adapters.json
