name: Generated native framework starters
on:
  pull_request:
    paths:
      - 'packages/create-mavis/**'
      - 'scripts/*native-creator*'
      - 'scripts/check-native-adapters.mjs'
      - '.github/workflows/native-creator.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-creator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: Creator packages (${{ matrix.manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: corepack enable
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/generate-native-adapters.mjs --check
      - run: node scripts/pack-release.mjs
      - run: |
          mkdir -p artifacts/packed-creator
          tar -xzf artifacts/release/packages/getcortexlabs-create-mavis-*.tgz --strip-components=1 -C artifacts/packed-creator
          node scripts/prepare-native-creator-acceptance.mjs
          node scripts/check-native-creator.mjs
        env:
          MAVIS_CREATOR_MANAGER: ${{ matrix.manager }}
          MAVIS_PACKED_CREATOR: ${{ github.workspace }}/artifacts/packed-creator
          MAVIS_CREATOR_CONSUMERS: ${{ runner.temp }}/mavis-native-creator
      - uses: actions/upload-artifact@v4
        with:
          name: creator-consumers-${{ matrix.manager }}
          path: artifacts/native-creator/consumer-report.json
  ios:
    name: Created ${{ matrix.framework }} on iOS
    runs-on: macos-15
    env:
      MAVIS_ADAPTER_APP_ID: org.nativescript.native${{ matrix.framework }}
      MAVIS_ADAPTER_OUTPUT: artifacts/native-creator
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        framework: [plain, react, angular, svelte, solid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install xcodeproj cocoapods --no-document
      - run: npm install --global nativescript@9.1.2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pack-release.mjs
      - name: Generate the selected starter from the packed creator
        run: |
          mkdir -p artifacts/packed-creator
          tar -xzf artifacts/release/packages/getcortexlabs-create-mavis-*.tgz --strip-components=1 -C artifacts/packed-creator
          node scripts/prepare-native-creator-acceptance.mjs ${{ matrix.framework }}
          npm install --prefix "$MAVIS_CREATOR_CONSUMERS/${{ matrix.framework }}" --no-audit --no-fund
        env:
          MAVIS_PACKED_CREATOR: ${{ github.workspace }}/artifacts/packed-creator
          MAVIS_CREATOR_CONSUMERS: ${{ runner.temp }}/mavis-native-creator
          MAVIS_CREATOR_RUNTIME_CHECK: '1'
      - run: node scripts/check-native-adapters.mjs ios ${{ matrix.framework }}
        env:
          MAVIS_ADAPTER_PROJECT: ${{ runner.temp }}/mavis-native-creator/${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: created-${{ matrix.framework }}-ios
          path: |
            artifacts/native-creator/ios/${{ matrix.framework }}
            artifacts/release/packages/installed-adapters.json
  android:
    name: Created ${{ matrix.framework }} on Android
    runs-on: ubuntu-latest
    env:
      MAVIS_ADAPTER_APP_ID: org.nativescript.native${{ matrix.framework }}
      MAVIS_ADAPTER_OUTPUT: artifacts/native-creator
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        framework: [plain, react, angular, svelte, solid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm install --global nativescript@9.1.2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pack-release.mjs
      - name: Generate the selected starter from the packed creator
        run: |
          mkdir -p artifacts/packed-creator
          tar -xzf artifacts/release/packages/getcortexlabs-create-mavis-*.tgz --strip-components=1 -C artifacts/packed-creator
          node scripts/prepare-native-creator-acceptance.mjs ${{ matrix.framework }}
          npm install --prefix "$MAVIS_CREATOR_CONSUMERS/${{ matrix.framework }}" --no-audit --no-fund
        env:
          MAVIS_PACKED_CREATOR: ${{ github.workspace }}/artifacts/packed-creator
          MAVIS_CREATOR_CONSUMERS: ${{ runner.temp }}/mavis-native-creator
          MAVIS_CREATOR_RUNTIME_CHECK: '1'
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAVIS_ADAPTER_PROJECT: ${{ runner.temp }}/mavis-native-creator/${{ matrix.framework }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: node scripts/check-native-adapters.mjs android ${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: created-${{ matrix.framework }}-android
          path: |
            artifacts/native-creator/android/${{ matrix.framework }}
            artifacts/release/packages/installed-adapters.json
