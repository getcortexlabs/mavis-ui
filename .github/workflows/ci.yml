name: Check library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Full browser, CLI and macOS matrix
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Picks the jobs below from the files this branch changed. See test/ci.md.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      full: ${{ steps.plan.outputs.full }}
      browser: ${{ steps.plan.outputs.browser }}
      browsers: ${{ steps.plan.outputs.browsers }}
      consumers: ${{ steps.plan.outputs.consumers }}
      nuxt: ${{ steps.plan.outputs.nuxt }}
      performance: ${{ steps.plan.outputs.performance }}
      cli: ${{ steps.plan.outputs.cli }}
      creators: ${{ steps.plan.outputs.creators }}
      macos: ${{ steps.plan.outputs.macos }}
      macos_delivery: ${{ steps.plan.outputs.macos_delivery }}
      macos_ui: ${{ steps.plan.outputs.macos_ui }}
      pack: ${{ steps.plan.outputs.pack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: node --test test/ci-plan.test.mjs test/publish-release.test.mjs
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_FULL: ${{ inputs.full == true }}

  # `npm run check` is split between `verify` and `build` so the two halves run in
  # parallel; together they run every command in that script.
  verify:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      # Template type checks read the packages' compiled declarations.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: python3 scripts/check-creator-terminal.py
        if: needs.plan.outputs.cli == 'true'

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the packages, the docs and the playground.
      - run: npm run docs:build
      - run: node scripts/pack-release.mjs
        if: needs.plan.outputs.pack == 'true'
      - name: Archive this commit's build for downstream jobs
        run: |
          paths=(packages/core/dist packages/nativescript/dist packages/web/dist packages/compiler/dist docs/.vitepress/dist)
          if [[ -d artifacts/release/packages ]]; then paths+=(artifacts/release/packages); fi
          tar -czf ci-build.tar.gz "${paths[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-build
          path: ci-build.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 7

  browser:
    name: browser (${{ matrix.label }})
    needs: [plan, build]
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep all browser job images aligned with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Match the hosted runner's mounted home owner so Firefox can create its profile.
      # https://playwright.dev/docs/ci#via-containers
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - name: Browser behavior
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_FILTERS: ${{ matrix.filters }}
        run: |
          # File filters must precede the options: --project takes several values.
          read -ra filters <<< "$BROWSER_FILTERS"
          args=(--shard "$BROWSER_SHARD")
          if [[ "$BROWSER_PROJECT" != all ]]; then args+=(--project "$BROWSER_PROJECT"); fi
          npx playwright test "${filters[@]}" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ strategy.job-index }}
          path: artifacts/browser
          retention-days: 7

  consumers:
    needs: [plan, build]
    if: needs.plan.outputs.consumers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - run: npm ci --no-audit --no-fund
        working-directory: examples/catalog
      - run: npm run bundle:android
        working-directory: examples/catalog
      - run: npm run bundle:ios
        working-directory: examples/catalog
      - run: npm run release:check
      - run: node scripts/check-modular-consumer.mjs
      - run: node scripts/check-consumer-web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-consumers
          path: artifacts/release/*.json
          retention-days: 7

  nuxt:
    name: nuxt (${{ matrix.mode }})
    needs: [plan, build]
    if: needs.plan.outputs.nuxt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        mode: [ssr, static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - run: node scripts/check-core-consumer.mjs
        if: matrix.mode == 'ssr'
      # Each mode installs and builds its own consumer from the packed tarballs.
      - run: node scripts/check-nuxt-consumer.mjs
      - run: node scripts/check-nuxt-browser.mjs
        if: matrix.mode == 'ssr'
      - run: node scripts/check-nuxt-static.mjs
        if: matrix.mode == 'static'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuxt-${{ matrix.mode }}-review
          path: artifacts/ssr
          retention-days: 7

  performance:
    needs: [plan, build]
    if: needs.plan.outputs.performance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      # Only the instrumented playground differs from the shared build artifact.
      - run: npm run web:build
        env:
          VITE_PERFORMANCE_CHECK: 'true'
      - run: |
          mkdir -p artifacts/performance
          npm run preview --workspace mavis-catalog-web -- --strictPort > artifacts/performance/server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node scripts/check-web-performance.mjs ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-review
          path: artifacts/performance
          retention-days: 7

  creator:
    needs: [plan, build]
    if: needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    # Keep aligned with @playwright/test in package.json. Browsers and OS libraries
    # are preinstalled so a slow Ubuntu package mirror cannot consume the job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.creators) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - run: npm install --global pnpm@12.16.1
        if: matrix.package-manager == 'pnpm'
      - run: npm install --global @yarnpkg/cli-dist@4.18.1 --force
        if: matrix.package-manager == 'yarn'
      - name: Read the pinned Jolt release for Yarn checks
        id: jolt
        if: matrix.package-manager == 'yarn'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const version = JSON.parse(readFileSync('package.json', 'utf8')).devDependencies['@rafaelaugusto/jolt']
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Jolt must have an exact version pin')
          appendFileSync(process.env.GITHUB_OUTPUT, `package=@rafaelaugusto/jolt@${version}\n`)
          NODE
      - run: node scripts/check-creator-workspaces.mjs ${{ matrix.package-manager }}
        if: matrix.preset == 'both-vite' && (matrix.example == 'welcome' || needs.plan.outputs.full != 'true')
      - run: node scripts/check-project-creator.mjs ${{ matrix.preset }} --package-manager ${{ matrix.package-manager }} --example ${{ matrix.example }} --local-packages --keep
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          COREPACK_ENABLE_AUTO_PIN: '0'
          # Only this exact reviewed release; keep all other Yarn policies in effect.
          YARN_NPM_PREAPPROVED_PACKAGES: ${{ steps.jolt.outputs.package }}
      - run: node scripts/check-project-creator.mjs ${{ matrix.preset }} --package-manager ${{ matrix.package-manager }} --local-packages --adopt
        if: matrix.example == 'welcome' && matrix.preset != 'both-vite' && matrix.preset != 'both-nuxt'
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          COREPACK_ENABLE_AUTO_PIN: '0'
          YARN_NPM_PREAPPROVED_PACKAGES: ${{ steps.jolt.outputs.package }}
      - run: npx playwright test --config playwright.sharing.config.ts
        if: matrix.example == 'directory' && matrix.preset != 'mobile'
        env:
          MAVIS_CREATOR_CASE: ${{ matrix.preset }}
          MAVIS_CREATOR_PACKAGE_MANAGER: ${{ matrix.package-manager }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-${{ matrix.preset }}-${{ matrix.package-manager }}-${{ matrix.example }}
          path: |
            artifacts/creator
            artifacts/sharing
          retention-days: 7

  # Projects with shared TSX sources: Web + Native + Mac generated with each package manager,
  # the Web app in Chromium and WebKit, and the NativeScript bundles for Android and iOS.
  macos-web:
    needs: [plan, build]
    if: needs.plan.outputs.macos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, yarn]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - run: corepack enable
      - run: node scripts/check-macos-creator.mjs --targets web,native,macos --package-manager ${{ matrix.package-manager }} ${{ matrix.package-manager == 'npm' && '--web' || '' }}
      # The Tasks example as created: Web build, Chromium and WebKit, NativeScript bundles.
      - if: matrix.package-manager == 'npm'
        run: node scripts/check-macos-creator.mjs --targets web,native,macos --example tasks --web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-web-${{ matrix.package-manager }}
          path: artifacts/macos/validation-*.json
          retention-days: 7

  # Replay the complete Web corpus independently of creator installs. Each shard
  # builds one Vite app and runs its fixtures in both Chromium and WebKit.
  portable-web:
    name: portable Web (${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.macos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - name: Portable Web conformance in Chromium and WebKit
        env:
          PORTABLE_SHARD: ${{ matrix.shard }}
        run: node scripts/check-portable-conformance.mjs --web --shard "$PORTABLE_SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-web-${{ strategy.job-index }}
          path: artifacts/portable/report.json
          retention-days: 7

  # Compile the entire corpus before UI work, independently of docs/tarball delivery.
  # This catches generated Swift failures without installing all the consumer apps first.
  macos-compile:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: gem install xcodeproj --no-document --user-install
      - name: Compile every SwiftUI fixture and the XCUITest runner without opening an app
        run: node scripts/check-portable-conformance.mjs --native --build-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-compile
          path: |
            artifacts/portable/report.json
            artifacts/portable/native/build-results.xcresult
            artifacts/portable/native/xcodebuild.log
          retention-days: 7

  # Packed delivery checks do not hold up one another or the conformance runner.
  macos-delivery:
    name: macos delivery (${{ matrix.label }})
    needs: [plan, build]
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos_delivery) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - name: Packed starter
        if: matrix.check == 'creator'
        run: node scripts/check-macos-creator.mjs --targets "${{ matrix.targets }}" --example "${{ matrix.example }}" --mac
      - name: Directory startup and store identity without a window
        if: matrix.check == 'startup'
        run: node scripts/check-directory-startup.mjs
      - name: Adopt the published Directory and build Nuxt SSR/SSG plus SwiftUI
        if: matrix.check == 'adoption'
        run: node scripts/check-macos-adoption.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-delivery-${{ matrix.label }}
          path: |
            artifacts/macos/validation-*.json
            artifacts/directory-startup/result.json
            artifacts/macos-adoption/latest.json
            artifacts/macos-adoption/run-*/result.json
            artifacts/macos-adoption/run-*/dependency-upgrades.json
            artifacts/macos-adoption/run-*/migration-preview.json
          retention-days: 7

  macos:
    name: macos UI (${{ matrix.label }})
    needs: [plan, build, macos-compile]
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos_ui) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - run: gem install xcodeproj --no-document --user-install
      - name: SwiftUI UI smoke or full corpus shard
        env:
          MACOS_SCOPE: ${{ matrix.scope }}
          MACOS_SHARD: ${{ matrix.shard }}
        run: |
          args=(--native)
          if [[ "$MACOS_SCOPE" == smoke ]]; then
            args+=(--smoke)
          else
            args+=(--shard "$MACOS_SHARD")
            # Preserve successful recordings only for full runs, including docs captures.
            export MAVIS_KEEP_RECORDINGS=1
          fi
          node scripts/check-portable-conformance.mjs "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-ui-${{ strategy.job-index }}
          path: |
            artifacts/portable/report.json
            artifacts/portable/native/results.xcresult
            artifacts/portable/native/xcodebuild.log
          retention-days: 7

  # Stable required-check name, including runs where jobs are intentionally skipped.
  check:
    needs:
      [
        plan,
        verify,
        build,
        browser,
        consumers,
        nuxt,
        performance,
        creator,
        macos-web,
        portable-web,
        macos-compile,
        macos-delivery,
        macos,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Require every selected check to pass
        env:
          CI_CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.mjs --check-results
