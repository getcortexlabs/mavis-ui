name: Check library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-review
          path: artifacts/browser
          retention-days: 7
      - run: npm ci --no-audit --no-fund
        working-directory: examples/catalog
      - run: npm run bundle:android
        working-directory: examples/catalog
      - run: npm run bundle:ios
        working-directory: examples/catalog
