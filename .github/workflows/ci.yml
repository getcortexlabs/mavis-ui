name: Check library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Full browser and CLI matrix
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      full: ${{ steps.plan.outputs.full }}
      docsOnly: ${{ steps.plan.outputs.docsOnly }}
      integration: ${{ steps.plan.outputs.integration }}
      performance: ${{ steps.plan.outputs.performance }}
      browsers: ${{ steps.plan.outputs.browsers }}
      creators: ${{ steps.plan.outputs.creators }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: node --test test/ci-plan.test.mjs
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_FULL: ${{ inputs.full == true }}

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: python3 scripts/check-creator-terminal.py
        if: needs.plan.outputs.integration == 'true'
      # npm run check already builds the library, docs and playground.
      - run: node scripts/pack-release.mjs
        if: needs.plan.outputs.integration == 'true'
      - name: Archive this commit's build for downstream jobs
        run: |
          paths=(packages/core/dist packages/nativescript/dist packages/web/dist docs/.vitepress/dist)
          if [[ -d artifacts/release/packages ]]; then paths+=(artifacts/release/packages); fi
          tar -czf ci-build.tar.gz "${paths[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-build
          path: ci-build.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 7

  browser:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep all browser job images aligned with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - name: Browser behavior
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_SCOPE: ${{ matrix.scope }}
        run: |
          args=(--project "$BROWSER_PROJECT" --shard "$BROWSER_SHARD")
          if [[ "$BROWSER_SCOPE" == docs ]]; then args+=(docs); fi
          npx playwright test "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.project }}-${{ strategy.job-index }}
          path: artifacts/browser
          retention-days: 7

  consumers:
    needs: [plan, build]
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - run: npm ci --no-audit --no-fund
        working-directory: examples/catalog
      - run: npm run bundle:android
        working-directory: examples/catalog
      - run: npm run bundle:ios
        working-directory: examples/catalog
      - run: npm run release:check
      - run: node scripts/check-modular-consumer.mjs
      - run: node scripts/check-consumer-web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-consumers
          path: artifacts/release/*.json
          retention-days: 7

  nuxt:
    needs: [plan, build]
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - run: node scripts/check-core-consumer.mjs
      - run: node scripts/check-nuxt-consumer.mjs
      - run: node scripts/check-nuxt-browser.mjs
      - run: node scripts/check-nuxt-static.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuxt-ssr-review
          path: artifacts/ssr
          retention-days: 7

  performance:
    needs: [plan, build]
    if: needs.plan.outputs.performance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      # Only the instrumented playground differs from the shared build artifact.
      - run: npm run web:build
        env:
          VITE_PERFORMANCE_CHECK: 'true'
      - run: |
          mkdir -p artifacts/performance
          npm run preview --workspace mavis-catalog-web -- --strictPort > artifacts/performance/server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node scripts/check-web-performance.mjs ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-review
          path: artifacts/performance
          retention-days: 7

  creator:
    needs: [plan, build]
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    # Keep aligned with @playwright/test in package.json. Browsers and OS libraries
    # are preinstalled so a slow Ubuntu package mirror cannot consume the job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.creators) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ci-build
      - run: tar -xzf ci-build.tar.gz
      - run: npm install --global pnpm@12.16.1
        if: matrix.package-manager == 'pnpm'
      - run: npm install --global @yarnpkg/cli-dist@4.18.1 --force
        if: matrix.package-manager == 'yarn'
      - run: node scripts/check-creator-workspaces.mjs ${{ matrix.package-manager }}
        if: matrix.preset == 'both-vite' && (matrix.example == 'welcome' || needs.plan.outputs.full != 'true')
      - run: node scripts/check-project-creator.mjs ${{ matrix.preset }} --package-manager ${{ matrix.package-manager }} --example ${{ matrix.example }} --local-packages --keep
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          COREPACK_ENABLE_AUTO_PIN: '0'
          # Test our pinned Jolt release during Yarn's initial quarantine.
          YARN_NPM_PREAPPROVED_PACKAGES: '@rafaelaugusto/jolt@0.1.0-rc.11'
      - run: node scripts/check-project-creator.mjs ${{ matrix.preset }} --package-manager ${{ matrix.package-manager }} --local-packages --adopt
        if: matrix.example == 'welcome' && matrix.preset != 'both-vite' && matrix.preset != 'both-nuxt'
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          COREPACK_ENABLE_AUTO_PIN: '0'
          YARN_NPM_PREAPPROVED_PACKAGES: '@rafaelaugusto/jolt@0.1.0-rc.11'
      - run: npx playwright test --config playwright.sharing.config.ts
        if: matrix.example == 'directory' && matrix.preset != 'mobile'
        env:
          MAVIS_CREATOR_CASE: ${{ matrix.preset }}
          MAVIS_CREATOR_PACKAGE_MANAGER: ${{ matrix.package-manager }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-${{ matrix.preset }}-${{ matrix.package-manager }}-${{ matrix.example }}
          path: |
            artifacts/creator
            artifacts/sharing
          retention-days: 7

  # Stable required-check name, including runs where integrations are intentionally skipped.
  check:
    needs: [plan, build, browser, consumers, nuxt, performance, creator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); for (const [name, { result }] of Object.entries(results)) { console.log(`${name}: ${result}`); if (result !== "success" && result !== "skipped") process.exitCode = 1; }'
