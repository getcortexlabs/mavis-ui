name: Native masonry layout
on:
  pull_request:
    paths:
      - '.github/workflows/masonry.yml'
      - 'packages/core/src/advanced-collections.ts'
      - 'packages/core/src/vue/advanced-collections.ts'
      - 'packages/nativescript/src/vue/components/advanced.ts'
      - 'test/portable/masonry*/**'
      - 'test/portable-native/probe.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci --no-audit --no-fund
      - run: npm install --global nativescript@9.1.2
      - run: npm run release:pack
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: MAVIS_ANDROID_DEVICE=emulator-5554 MAVIS_FIXTURES=masonry,masonryVue node scripts/check-portable-conformance.mjs --nativescript android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masonry-android-geometry
          path: artifacts/portable/nativescript-android.json
