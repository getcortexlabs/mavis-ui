name: Native Jolt compatibility
on:
  pull_request:
    paths:
      - '.github/workflows/native-jolt.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/nativescript/**'
      - 'packages/core/**'
      - 'examples/catalog/**'
      - 'scripts/check-native-jolt*.mjs'
      - 'scripts/check-native-pointer.mjs'
      - 'scripts/check-native-screen-components.mjs'
      - 'scripts/check-native-touch.mjs'
      - 'scripts/native-input-project.rb'
      - 'scripts/check-native-dashboard.mjs'
      - 'scripts/check-native-preference.mjs'
      - 'scripts/native-recording.mjs'
      - 'scripts/install-acceptance-tarballs.mjs'
      - 'test/browser/layout-motion.browser.ts'
      - 'test/browser/preference-race.browser.ts'
      - 'test/browser/reduced-motion.browser.ts'
      - 'test/browser/kanban-drop.browser.ts'
      - 'test/native-input/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-jolt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-acceptance:
    name: Layout and motion on Chromium, WebKit and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run docs:build
      - run: node scripts/pack-release.mjs
      - run: node scripts/install-acceptance-tarballs.mjs web
      - run: npm run web:build
      - run: npx playwright test layout-motion.browser.ts reduced-motion.browser.ts preference-race.browser.ts kanban-drop.browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-motion-browser
          path: |
            artifacts/browser
            artifacts/release/packages/installed-web.json
  swift-layers:
    name: Sized layers in SwiftUI
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/check-portable-conformance.mjs --offscreen
        env:
          MAVIS_FIXTURES: layers,layersVue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sized-layers-swift
          path: artifacts/portable/report.json
  ios:
    name: Jolt on iOS simulator (${{ matrix.probe }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - probe: jolt15
            flag: jolt15Check
          - probe: pointer
            flag: pointerCheck
          - probe: screen-components
            flag: screenComponentsCheck
          - probe: touch
            flag: touchCheck
          - probe: dashboard
            flag: dashboardCheck
          - probe: preference
            flag: preferenceCheck
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install xcodeproj cocoapods --no-document
      - run: npm install --global nativescript@9.1.2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --prefix examples/catalog --no-audit --no-fund
      - run: node scripts/pack-release.mjs
        if: matrix.probe == 'preference' || matrix.probe == 'dashboard'
      - run: node scripts/install-acceptance-tarballs.mjs native
        if: matrix.probe == 'preference' || matrix.probe == 'dashboard'
      - name: Rebuild the iOS catalog
        working-directory: examples/catalog
        run: ns build ios --for-device false --env.${{ matrix.flag }}
      - name: Run the existing native compatibility probe
        run: node scripts/check-native-jolt-ci.mjs ios --probe=${{ matrix.probe }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.probe }}-ios-acceptance
          path: |
            artifacts/${{ matrix.probe }}/ios
            !artifacts/${{ matrix.probe }}/ios/build
            artifacts/release/packages/installed-native.json
  android:
    name: Jolt on Android emulator (${{ matrix.probe }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - probe: jolt15
            flag: jolt15Check
          - probe: pointer
            flag: pointerCheck
          - probe: screen-components
            flag: screenComponentsCheck
          - probe: touch
            flag: touchCheck
          - probe: dashboard
            flag: dashboardCheck
          - probe: preference
            flag: preferenceCheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm install --global nativescript@9.1.2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --prefix examples/catalog --no-audit --no-fund
      - run: node scripts/pack-release.mjs
        if: matrix.probe == 'preference' || matrix.probe == 'dashboard'
      - run: node scripts/install-acceptance-tarballs.mjs native
        if: matrix.probe == 'preference' || matrix.probe == 'dashboard'
      - name: Rebuild and run the existing native compatibility probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: node scripts/check-native-jolt-ci.mjs android --probe=${{ matrix.probe }} --build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.probe }}-android-acceptance
          path: |
            artifacts/${{ matrix.probe }}/android
            artifacts/release/packages/installed-native.json
