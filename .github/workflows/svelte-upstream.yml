name: Svelte Native upstream regressions
on:
  push:
    branches: [fix/svelte-native-runtime]
permissions:
  contents: read
concurrency:
  group: svelte-upstream-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: Svelte upstream iOS (${{ matrix.bootstrap }})
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        framework: [svelte]
        bootstrap: [frame, no-frame]
    env:
      MAVIS_SVELTE_NO_FRAME: ${{ matrix.bootstrap == 'no-frame' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rafaelaugustos/svelte-native
          ref: 300e93f0066f1b3f343cd7bfaf612ac09efb3c5a
          path: artifacts/svelte-native-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install xcodeproj cocoapods --no-document
      - run: npm install --global nativescript@9.1.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: artifacts/svelte-native-source
      - run: npm test && npm run build
        working-directory: artifacts/svelte-native-source
      - run: npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
        working-directory: artifacts/svelte-native-source/dist
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pack-release.mjs
      - run: npm ci --prefix examples/native-adapters --no-audit --no-fund
      - run: node scripts/install-acceptance-tarballs.mjs adapters artifacts/nativescript-community-svelte-native-1.0.32.tgz
      - run: node scripts/check-native-adapters.mjs ios ${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svelte-upstream-ios-${{ matrix.bootstrap }}
          path: |
            artifacts/native-adapters/ios/${{ matrix.framework }}
            artifacts/release/packages/installed-adapters.json
            artifacts/nativescript-community-svelte-native-1.0.32.tgz
  android:
    name: Svelte upstream Android (${{ matrix.bootstrap }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        framework: [svelte]
        bootstrap: [frame, no-frame]
    env:
      MAVIS_SVELTE_NO_FRAME: ${{ matrix.bootstrap == 'no-frame' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rafaelaugustos/svelte-native
          ref: 300e93f0066f1b3f343cd7bfaf612ac09efb3c5a
          path: artifacts/svelte-native-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm install --global nativescript@9.1.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: artifacts/svelte-native-source
      - run: npm test && npm run build
        working-directory: artifacts/svelte-native-source
      - run: npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
        working-directory: artifacts/svelte-native-source/dist
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pack-release.mjs
      - run: npm ci --prefix examples/native-adapters --no-audit --no-fund
      - run: node scripts/install-acceptance-tarballs.mjs adapters artifacts/nativescript-community-svelte-native-1.0.32.tgz
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: node scripts/check-native-adapters.mjs android ${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svelte-upstream-android-${{ matrix.bootstrap }}
          path: |
            artifacts/native-adapters/android/${{ matrix.framework }}
            artifacts/release/packages/installed-adapters.json
            artifacts/nativescript-community-svelte-native-1.0.32.tgz
