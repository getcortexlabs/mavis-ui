name: Experimental AppKit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/appkit.yml'
      - 'examples/appkit/**'
      - 'scripts/check-appkit.mjs'
      - 'test/appkit-renderer.spec.ts'
      - 'packages/create-mavis/templates/directory/**'
      - 'packages/core/src/theme/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: appkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appkit:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix examples/appkit --no-audit --no-fund
      - run: npx tsc --noEmit -p examples/appkit/tsconfig.json
      - run: npx vitest run test/appkit-renderer.spec.ts --maxWorkers=2
      - name: Run the standalone app outside the checkout through AppKit input
        run: node scripts/check-appkit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appkit-acceptance
          path: artifacts/appkit
